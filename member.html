<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成员主页 | 20260624班</title>
<style>
  :root{
    --navy:#024D9F;--ink:#1B1B1F;--ink-2:#4A4A52;--ink-3:#7A7A85;
    --paper:#FBFAF7;--line:#E4E0D8;--warm:#B8572E;
    --serif:"Songti SC","Noto Serif SC",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.75}
  a{color:var(--navy);text-decoration:none}
  .wrap{max-width:720px;margin:0 auto;padding:0 24px}
  .top{padding:32px 0;border-bottom:1px solid var(--line)}
  .top a{font-size:13.5px;color:var(--ink-3)}
  .card{padding:72px 0 56px}
  .role{
    display:inline-block;font-size:12px;letter-spacing:.16em;color:var(--warm);
    border:1px solid rgba(184,87,46,.35);padding:5px 12px;margin-bottom:28px;font-weight:600;
  }
  h1{font-family:var(--serif);font-size:clamp(40px,7vw,58px);line-height:1.2;font-weight:700}
  .sub{color:var(--ink-3);font-size:13.5px;margin-top:14px;letter-spacing:.04em}
  .sect{margin-top:52px;padding-top:32px;border-top:1px solid var(--line)}
  .sect h2{
    font-size:12px;letter-spacing:.18em;color:var(--ink-3);
    font-weight:600;margin-bottom:14px;text-transform:uppercase;
  }
  .duty{font-size:17px;color:var(--ink-2)}
  .duty.empty{color:var(--ink-3);font-style:normal}
  .gh{
    display:inline-flex;align-items:center;gap:8px;font-size:15px;
    border-bottom:1px solid rgba(2,77,159,.3);padding-bottom:2px;
  }
  .actions{margin-top:56px;display:flex;gap:12px;flex-wrap:wrap}
  .btn{
    display:inline-block;padding:11px 20px;font-size:14px;border:1px solid var(--line);
    background:#fff;color:var(--ink-2);transition:all .2s;
  }
  .btn:hover{border-color:var(--navy);color:var(--navy)}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.primary:hover{background:var(--navy-deep,#013A78);color:#fff}
  .note{
    margin-top:22px;font-size:13px;color:var(--ink-3);line-height:1.8;
    background:#fff;border:1px solid var(--line);padding:18px 20px;
  }
  .note b{color:var(--ink-2);font-weight:600}
  .tl{border-left:2px solid var(--line);padding-left:22px}
  .tl-item{position:relative;padding-bottom:26px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{
    content:"";position:absolute;left:-28px;top:9px;
    width:8px;height:8px;border-radius:50%;background:var(--navy);
  }
  .tl-date{font-family:var(--serif);font-weight:700;font-size:12.5px;color:var(--navy)}
  .tl-type{
    display:inline-block;margin-left:8px;font-size:11px;color:var(--warm);
    border:1px solid rgba(184,87,46,.35);padding:0 7px;
  }
  .tl-title{font-size:15.5px;font-weight:600;margin:6px 0 4px;line-height:1.5}
  .tl-text{font-size:14px;color:var(--ink-2)}
  .tl-links{margin-top:8px;font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
  footer{padding:40px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html#members">← 返回班级成员</a></div>

  <div class="card">
    <div class="role" id="role">成员</div>
    <h1 id="name">—</h1>
    <div class="sub" id="sub">哈尔滨工程大学 · 20260624班</div>

    <div class="sect">
      <h2>个人工作</h2>
      <div class="duty empty" id="duty">暂未填写</div>
    </div>

    <div class="sect">
      <h2>成长记录</h2>
      <div id="records" class="tl"><div class="duty empty">暂无记录</div></div>
    </div>

    <div class="sect">
      <h2>GitHub</h2>
      <div id="ghbox"><span class="duty empty">尚未绑定</span></div>
    </div>

    <div id="emailbox"></div>

    <div class="actions">
      <a class="btn primary" id="edit" href="#" target="_blank" rel="noopener">用 GitHub 登录并编辑我的信息</a>
      <a class="btn" href="index.html#members">看看其他同学</a>
    </div>

    <div class="note">
      <b>怎么改？</b>点上面的按钮会跳转到 GitHub 的在线编辑器，用你自己的 GitHub 账号登录后，
      找到 <b>你的那条记录</b>，修改 <b>duty</b>（个人工作，写你担任的职务或负责的事情）和
      <b>github</b>（你的 GitHub 用户名或主页链接），提交即可。提交后 1 分钟内本页自动更新。
      第一次编辑前需要班主任把你的账号加为仓库协作者。
    </div>
  </div>

  <footer>20260624 班 · 班级成员主页</footer>
</div>

<script>
(function(){
  var REPO = 'https://github.com/dapenglang/class-20260624/edit/main/data/members.json';
  var id = new URLSearchParams(location.search).get('id');
  document.getElementById('edit').href = REPO;
  if (!id) return;

  fetch('data/records.json?v=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){
    var items = (d.records || []).filter(function(x){ return String(x.id) === String(id); });
    items.sort(function(a, b){ return String(b.date || '').localeCompare(String(a.date || '')); });
    if (!items.length) return;
    function esc(s){
      return String(s).replace(/[&<>"]/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
      });
    }
    document.getElementById('records').innerHTML = items.map(function(x){
      var links = (x.links || []).map(function(l){
        return '<a href="' + esc(l.url) + '">' + esc(l.text) + ' →</a>';
      }).join('');
      return '<div class="tl-item">'
        + '<div><span class="tl-date">' + esc(x.date || '') + '</span>'
        + (x.type ? '<span class="tl-type">' + esc(x.type) + '</span>' : '') + '</div>'
        + '<div class="tl-title">' + esc(x.title || '') + '</div>'
        + (x.text ? '<div class="tl-text">' + esc(x.text) + '</div>' : '')
        + (links ? '<div class="tl-links">' + links + '</div>' : '')
        + '</div>';
    }).join('');
  }).catch(function(){});
  fetch('data/members.json?v=' + Date.now()).then(function(r){ return r.json(); }).then(function(list){
    var m = null;
    for (var i=0;i<list.length;i++) if (String(list[i].id) === String(id)) { m = list[i]; break; }
    if (!m) {
      document.getElementById('name').textContent = '未找到该成员';
      return;
    }
    document.getElementById('role').textContent = m.role;
    var display = m.nick || m.name;
    document.getElementById('name').textContent = display;
    document.title = display + ' | 20260624班';
    if (m.duty) {
      var d = document.getElementById('duty');
      d.textContent = m.duty;
      d.classList.remove('empty');
    }
    if (m.github) {
      var u = m.github.indexOf('http') === 0 ? m.github : 'https://github.com/' + m.github.replace(/^@/,'');
      document.getElementById('ghbox').innerHTML =
        '<a class="gh" href="' + u + '" target="_blank" rel="noopener">github.com/' +
        u.replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,'') + ' ↗</a>';
    }
    if (m.email) {
      var eb = document.getElementById('emailbox');
      eb.innerHTML = '<div class="sect"><h2>联系邮箱</h2>'
        + '<a class="gh" href="mailto:' + m.email + '">' + m.email + ' ↗</a></div>';
    }
  });
})();
</script>
</body>
</html>
