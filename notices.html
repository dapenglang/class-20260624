95	<div class="wrap">
96	  <div class="page-head">
97	    <div class="eyebrow">Notices · 通知公告</div>
98	    <h1>全部通知</h1>
99	    <p class="sub" id="np-sub">正在加载…</p>
100	  </div>
101	
102	  <div id="np-list" class="notice-page-list">
103	    <div class="np-empty">正在加载通知…</div>
104	  </div>
105	
106	  <footer>
107	    <p>20260624 班 · <a href="index.html">返回班级首页</a> · 班主任、辅导员、班委成员可 <a href="https://github.com/dapenglang/class-20260624/edit/main/data/notices.json" target="_blank" rel="noopener">编辑 data/notices.json 发布通知</a>。</p>
108	  </footer>
109	</div>
110	
111	<script>
112	(function(){
113	  var box = document.getElementById('np-list');
114	  var sub = document.getElementById('np-sub');
115	  function esc(s){
116	    return String(s).replace(/[&<>"]/g, function(c){
117	      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
118	    });
119	  }
120	  fetch('data/notices.json?v=' + Date.now()).then(function(r){ return r.json(); }).then(function(data){
121	    var items = (data.items || []).slice().sort(function(a, b){
122	      return String(b.date || '').localeCompare(String(a.date || ''));
123	    });
124	    if (!items.length){
125	      box.innerHTML = '<div class="np-empty">暂无通知。</div>';
126	      sub.textContent = '';
127	      return;
128	    }
129	    sub.textContent = '共 ' + items.length + ' 条 · 按发布时间倒序排列';
130	    box.innerHTML = items.map(function(n){
131	      var ps = (n.body || []).map(function(t){ return '<p>' + esc(t) + '</p>'; }).join('');
132	      var li = (n.list || []).map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('');
133	      var links = (n.links || []).map(function(l){
134	        return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.text) + ' →</a>';
135	      }).join('');
136	      return '<article class="np-item" id="' + esc(n.id || '') + '">'
137	        + '<div class="np-meta">'
138	        +   '<span class="np-date">' + esc(n.date || '') + '</span>'
139	        +   '<span class="n-role">' + esc(n.role || '班委') + '</span>'
140	        +   '<span>' + esc(n.author || '') + '</span>'
141	        + '</div>'
142	        + '<h2>' + esc(n.title || '') + '</h2>'
143	        + ps
144	        + (li ? '<ol>' + li + '</ol>' : '')
145	        + (links ? '<div class="n-links">' + links + '</div>' : '')
146	        + '</article>';
147	    }).join('');
148	  }).catch(function(){
149	    box.innerHTML = '<div class="np-empty">通知加载失败，请刷新重试。</div>';
150	    sub.textContent = '';
151	  });
152	})();
153	</script>
