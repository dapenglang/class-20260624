<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全部通知 | 20260624班</title>
<meta name="description" content="哈尔滨工程大学 20260624 班全部通知公告。">
<style>
  :root{
    --navy:#024D9F;
    --navy-deep:#013A78;
    --ink:#1B1B1F;
    --ink-2:#4A4A52;
    --ink-3:#7A7A85;
    --paper:#FBFAF7;
    --line:#E4E0D8;
    --warm:#B8572E;
    --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--paper);
    line-height:1.75;-webkit-font-smoothing:antialiased;
  }
  a{color:var(--navy);text-decoration:none}
  .wrap{max-width:820px;margin:0 auto;padding:0 32px}

  nav{
    position:sticky;top:0;z-index:50;
    background:rgba(251,250,247,.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
  .brand .mark{
    width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;
    display:grid;place-items:center;font-family:var(--serif);font-size:13px;font-weight:700;
  }
  .brand small{display:block;font-size:11px;color:var(--ink-3);font-weight:400;letter-spacing:.08em}
  nav .back{font-size:13.5px;color:var(--ink-2)}
  nav .back:hover{color:var(--navy)}

  .page-head{padding:64px 0 36px;border-bottom:1px solid var(--line)}
  .eyebrow{
    font-size:11.5px;letter-spacing:.18em;color:var(--warm);
    text-transform:uppercase;font-weight:600;margin-bottom:14px;
  }
  .page-head h1{font-family:var(--serif);font-size:clamp(30px,5vw,42px);line-height:1.25;font-weight:700}
  .page-head .sub{color:var(--ink-3);font-size:13.5px;margin-top:12px}

  .notice-page-list{display:grid;gap:0;border-top:1px solid var(--line);margin-top:0}
  .np-item{border-bottom:1px solid var(--line);padding:28px 0;scroll-margin-top:80px}
  .np-item .np-meta{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    font-size:12px;color:var(--ink-3);margin-bottom:9px;
  }
  .np-item .np-date{font-family:var(--serif);color:var(--navy);font-weight:700}
  .np-item .n-role{
    border:1px solid rgba(2,77,159,.3);color:var(--navy);
    padding:0 7px;font-size:11px;letter-spacing:.06em;
  }
  .np-item h2{font-family:var(--serif);font-size:20px;line-height:1.5;margin-bottom:10px;font-weight:700}
  .np-item p{font-size:14.5px;color:var(--ink-2);margin-bottom:7px;line-height:1.8}
  .np-item ol{margin:6px 0 0 22px;font-size:14.5px;color:var(--ink-2)}
  .np-item li{margin-bottom:7px;line-height:1.75}
  .np-item .n-links{margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
  .np-empty{font-size:14px;color:var(--ink-3);padding:48px 0;text-align:center}

  footer{padding:44px 0 56px;border-top:1px solid var(--line);margin-top:40px}
  footer p{font-size:12.5px;color:var(--ink-3)}
  footer a{color:var(--ink-2)}

  @media (max-width:640px){
    .wrap{padding:0 20px}
    .page-head{padding:44px 0 28px}
    nav .wrap{height:58px}
    .np-item{padding:22px 0}
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="mark">24</span>
      <span>20260624班<small>HARBIN ENGINEERING UNIVERSITY</small></span>
    </a>
    <a class="back" href="index.html">← 返回首页</a>
  </div>
</nav>

<div class="wrap">
  <div class="page-head">
    <div class="eyebrow">Notices · 通知公告</div>
    <h1>全部通知</h1>
    <p class="sub" id="np-sub">正在加载…</p>
  </div>

  <div id="np-list" class="notice-page-list">
    <div class="np-empty">正在加载通知…</div>
  </div>

  <footer>
    <p>20260624 班 · <a href="index.html">返回班级首页</a> · 班主任、辅导员、班委成员可 <a href="https://github.com/dapenglang/class-20260624/edit/main/data/notices.json" target="_blank" rel="noopener">编辑 data/notices.json 发布通知</a>。</p>
  </footer>
</div>

<script>
(function(){
  var box = document.getElementById('np-list');
  var sub = document.getElementById('np-sub');
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  fetch('data/notices.json?v=' + Date.now()).then(function(r){ return r.json(); }).then(function(data){
    var items = (data.items || []).slice().sort(function(a, b){
      return String(b.date || '').localeCompare(String(a.date || ''));
    });
    if (!items.length){
      box.innerHTML = '<div class="np-empty">暂无通知。</div>';
      sub.textContent = '';
      return;
    }
    sub.textContent = '共 ' + items.length + ' 条 · 按发布时间倒序排列';
    box.innerHTML = items.map(function(n){
      var ps = (n.body || []).map(function(t){ return '<p>' + esc(t) + '</p>'; }).join('');
      var li = (n.list || []).map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('');
      var links = (n.links || []).map(function(l){
        return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.text) + ' →</a>';
      }).join('');
      return '<article class="np-item" id="' + esc(n.id || '') + '">'
        + '<div class="np-meta">'
        +   '<span class="np-date">' + esc(n.date || '') + '</span>'
        +   '<span class="n-role">' + esc(n.role || '班委') + '</span>'
        +   '<span>' + esc(n.author || '') + '</span>'
        + '</div>'
        + '<h2>' + esc(n.title || '') + '</h2>'
        + ps
        + (li ? '<ol>' + li + '</ol>' : '')
        + (links ? '<div class="n-links">' + links + '</div>' : '')
        + '</article>';
    }).join('');
  }).catch(function(){
    box.innerHTML = '<div class="np-empty">通知加载失败，请刷新重试。</div>';
    sub.textContent = '';
  });
})();
</script>
</body>
</html>
